AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31

Metadata:
  cfn-lint:
    config:
      configure_rules:
        E3031:
          exceptions:
            - none
      ignore_checks:
        - E3724 # The latest version of cfn-lint seems to think that CodeSigningConfigArn is not a valid parameter in Globals
        - W3660 # False positive on the Asset bucket configuration
        - W1028 # We currently have "unreachable" If conditions because they all apply to one env (testing in dev at the moment)

Parameters:
  Environment:
    Type: String
    Description: The name of the environment to deploy to
  CodeSigningConfigArn:
    Type: String
    Description: >
      The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Default: "none"
  PermissionsBoundary:
    Type: String
    Description: >
      The ARN of the permissions boundary to apply to any role created by the template
    Default: "none"
  VpcStackName:
    Type: String
    Description: The name of the stack used to create the VPC

Mappings:
  EnvironmentConfiguration:
    dev:
      dvsRpDomainName: dvs.dev.account.gov.uk
      clientId: SrmBL-rlWL4vsrAIY-fgNhgsAuo
      oidcBaseUrl: https://oidc.dev.account.gov.uk
    build:
      dvsRpDomainName: dvs.build.account.gov.uk
    staging:
      dvsRpDomainName: dvs.staging.account.gov.uk
    integration:
      dvsRpDomainName: dvs.integration.account.gov.uk
    production:
      dvsRpDomainName: dvs.account.gov.uk

Conditions:
  UseCodeSigning:
    !Not [!Equals [!Ref CodeSigningConfigArn, none]]
  UsePermissionsBoundary:
    !Not [!Equals [!Ref PermissionsBoundary, none]]
  DeployAPIGateway: !Or [
    !Equals [!Ref Environment, local],
    !Equals [!Ref Environment, dev]
  ]

Globals:
  Function:
    CodeSigningConfigArn: !If
      - UseCodeSigning
      - !Ref CodeSigningConfigArn
      - !Ref AWS::NoValue
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue
    Architectures:
      - arm64

Resources:

  # region Frontend assets bucket
  DvsAssetsBucket:
    # checkov:skip=CKV_AWS_18: "Ensure the S3 bucket has access logging enabled"
    Type: AWS::S3::Bucket
    Condition: DeployAPIGateway
    Properties:
      BucketName: !Sub ${Environment}-frontend-assets-${AWS::AccountId}-${AWS::Region}-an
      BucketNamespace: 'account-regional'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DvsAssetsBucketPolicy:
    Condition: DeployAPIGateway
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DvsAssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: MustUseSecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${DvsAssetsBucket.Arn}"
              - !Sub "${DvsAssetsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false
          - Sid: MustUseAtLeastTLS1_2
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${DvsAssetsBucket.Arn}"
              - !Sub "${DvsAssetsBucket.Arn}/*"
            Condition:
              NumericLessThan:
                "s3:TlsVersion": "1.2"

  # endregion
  SecretsKmsKeyAlias:
    Type: "AWS::KMS::Alias"
    Properties:
      AliasName: "alias/secretsKmsKey"
      TargetKeyId: !Ref SecretsKmsKey

  SecretsKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Key used to encrypt secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowSecretsManagerAccess
            Effect: Allow
            Principal:
              Service:
                - secretsmanager.amazonaws.com
            Action:
              - "kms:Decrypt"
              - "kms:GenerateDataKey"
            Resource: "*"

  LoginSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Secret for logging into the application
      Name: !Sub "${Environment}-login-secret"
      KmsKeyId: !Ref SecretsKmsKey

  LoginSecretAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowGetLoginSecret
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue # pragma: allowlist secret
            Resource:
              - !Ref LoginSecret
          - Sid: AllowDecryptLoginSecret
            Effect: Allow
            Action:
              - kms:Decrypt
            Resource:
              - !GetAtt SecretsKmsKey.Arn

  #region Oidc signing key

  OidcSigningKmsRsaKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Environment}-oidc-kms-rsa-key-alias"
      TargetKeyId: !Ref OidcSigningKmsRsaKey

  OidcSigningKmsRsaKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS signing key for signing requests to OneLogin
      PendingWindowInDays: 30
      KeyUsage: SIGN_VERIFY
      KeySpec: RSA_4096
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Sid: AllowIamManagement
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  OidcSigningKmsRsaKeyAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowSigningKms
            Effect: Allow
            Action:
              - kms:Sign
              - kms:GetPublicKey
            Resource:
              - !GetAtt OidcSigningKmsRsaKey.Arn
  #endregion
  #region Journey Result DynamoDB Table

  JourneyResultTableEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS encryption key for DVS journey result table
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Sid: AllowIamManagement
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowDynamodbAccessToEncryptionKey
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"

  JourneyResultTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Environment}-Journey-Result
      AttributeDefinitions:
        - AttributeName: referenceId
          AttributeType: S
      KeySchema:
        - AttributeName: referenceId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !GetAtt JourneyResultTableEncryptionKey.Arn
        SSEType: KMS
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: JourneyResultTable

  #endregion

  DvsRpApiGateway:
    Condition: DeployAPIGateway
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ApiGateway
      StageName: !Sub "${Environment}"
      AlwaysDeploy: true
      BinaryMediaTypes:
        - "image~1*"
        - "font~1*"
        - "application~1octet-stream"
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: api-spec.yaml
      MethodSettings:
        - CachingEnabled: false
          DataTraceEnabled: false
          HttpMethod: "*"
          ResourcePath: "/*"
          LoggingLevel: INFO
          MetricsEnabled: true
      TracingEnabled: true

  BasicAuthAuthorizerApiPermission:
    Condition: DeployAPIGateway
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "${BasicAuthAuthorizer.Arn}:latest"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DvsRpApiGateway}/authorizers/*"

  DvsRpApiWafAssociation:
    Condition: DeployAPIGateway
    Type: "AWS::WAFv2::WebACLAssociation"
    Properties:
      WebACLArn:
        !ImportValue "cloudfront-distribution-CloakingOriginWebACLArn"
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${DvsRpApiGateway}/stages/${Environment}"
    DependsOn:
      - DvsRpApiGatewayStage # Needs to wait for the stage created by the AWS::Serverless::Api

  DvsRpOriginRecordSet:
    Condition: DeployAPIGateway
    Type: AWS::Route53::RecordSet
    Properties:
      Name: !Sub
        - "origin.${dvsRpDomain}"
        - dvsRpDomain:
            !FindInMap [
              EnvironmentConfiguration,
              !Ref Environment,
              dvsRpDomainName,
            ]
      Type: A
      HostedZoneId: !ImportValue hosted-zone-HostedZoneID
      AliasTarget:
        DNSName: !GetAtt DvsRpApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt DvsRpApiDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  DvsRpCloudFrontRecordSet:
    Condition: DeployAPIGateway
    Type: AWS::Route53::RecordSet
    Properties:
      Name:
        !FindInMap [EnvironmentConfiguration, !Ref Environment, dvsRpDomainName]
      Type: A
      HostedZoneId: !ImportValue hosted-zone-HostedZoneID
      AliasTarget:
        DNSName: !ImportValue cloudfront-distribution-DistributionDomain
        HostedZoneId: "Z2FDTNDATAQYW2" # Cloudfront Hosted Zone ID: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-route53-recordset-aliastarget.html#:~:text=vpc%2Dendpoints.-,CloudFront%20distribution,-Specify%20Z2FDTNDATAQYW2.%20This
        EvaluateTargetHealth: false

  DvsRpApiMapping:
    Condition: DeployAPIGateway
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dvsRpDomainName ]
      RestApiId: !Ref DvsRpApiGateway
      Stage: !Sub "${Environment}"
    DependsOn:
      - DvsRpApiDomain

  DvsRpApiDomain:
    Condition: DeployAPIGateway
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dvsRpDomainName ]
      SecurityPolicy: TLS_1_2
      RegionalCertificateArn: !ImportValue "certificate-CertificateARN"
      EndpointConfiguration:
        Types:
          - REGIONAL

  DvsPublicAssetsApiRole:
    Condition: DeployAPIGateway
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDvsAssetsBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DvsAssetsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DvsAssetsBucket.Arn

  JwksHandler:
    Condition: DeployAPIGateway
    Type: AWS::Serverless::Function
    Properties:
      AutoPublishAlias: latest
      CodeUri: .
      Handler: src/handlers/jwks.handler
      Runtime: nodejs24.x
      Environment:
        Variables:
          ENVIRONMENT: !Sub ${Environment}
          SIGNING_KEY_ALIAS: !Ref OidcSigningKmsRsaKeyAlias
      Policies:
        - !Ref OidcSigningKmsRsaKeyAccessPolicy
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/jwks.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        UseNpmCi: True

  BasicAuthAuthorizer:
    Condition: DeployAPIGateway
    Type: AWS::Serverless::Function
    Properties:
      AutoPublishAlias: latest
      CodeUri: .
      Handler: src/basic-auth-authorizer.handler
      Runtime: nodejs24.x
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdA
          - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdB
          - Fn::ImportValue: !Sub ${VpcStackName}-PrivateSubnetIdC
      Environment:
        Variables:
          ENVIRONMENT: !Sub ${Environment}
          LOGIN_SECRET_ID: !Ref LoginSecret
      Policies:
        - !Ref LoginSecretAccessPolicy
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/basic-auth-authorizer.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        UseNpmCi: True

  AuthorizeHandler:
    Condition: DeployAPIGateway
    Type: AWS::Serverless::Function
    Properties:
      AutoPublishAlias: latest
      CodeUri: .
      Handler: src/handlers/authorize.handler
      Runtime: nodejs24.x
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
          - !Ref HttpsEgressSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub ${VpcStackName}-ProtectedSubnetIdA
          - Fn::ImportValue: !Sub ${VpcStackName}-ProtectedSubnetIdB
          - Fn::ImportValue: !Sub ${VpcStackName}-ProtectedSubnetIdC
      Environment:
        Variables:
          ENVIRONMENT: !Sub ${Environment}
          SIGNING_KEY_ALIAS: !Ref OidcSigningKmsRsaKeyAlias
          CLIENT_ID: !FindInMap [ EnvironmentConfiguration, !Ref Environment, clientId ]
          OIDC_BASE_URL: !FindInMap [ EnvironmentConfiguration, !Ref Environment, oidcBaseUrl ]
          OIDC_AUTHORIZE_REDIRECT_URL: !Sub
            - "https://${dvsRpDomain}/callback"
            - dvsRpDomain:
                !FindInMap [
                  EnvironmentConfiguration,
                  !Ref Environment,
                  dvsRpDomainName,
                ]
      Policies:
        - !Ref OidcSigningKmsRsaKeyAccessPolicy
        - !Ref LoginSecretAccessPolicy
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/authorize.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        UseNpmCi: True

  JwksHandlerApiPermission:
    Condition: DeployAPIGateway
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "${JwksHandler.Arn}:latest"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DvsRpApiGateway}/*/*/.well-known/jwks.json"

  AuthorizeHandlerApiPermission:
    Condition: DeployAPIGateway
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub "${AuthorizeHandler.Arn}:latest"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DvsRpApiGateway}/*/*/authorize"

  HttpsEgressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow egress to external services
      VpcId:
        Fn::ImportValue: !Sub ${VpcStackName}-VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow all outgoing HTTPS requests from security group
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda Security Group permissions ruleset
      VpcId:
        Fn::ImportValue: !Sub ${VpcStackName}-VpcId
      SecurityGroupEgress:
        - DestinationSecurityGroupId:
            Fn::ImportValue: !Sub ${VpcStackName}-AWSServicesEndpointSecurityGroupId
          Description: Allow outbound traffic to vpc endpoints
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
        - DestinationPrefixListId: pl-b3a742da
          Description: Allow traffic to dynamoDb
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
